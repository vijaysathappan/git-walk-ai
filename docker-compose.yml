services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitwalk
      POSTGRES_USER: gitwalk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitwalk"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: gitwalk
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  api:
    build: ./backend
    environment:
      APP_ENV: development
      # Compatibility metadata remains SQLite during dual-read migration.
      # PostgreSQL is provisioned alongside it for the SQLAlchemy/Alembic cutover.
      DATABASE_URL: sqlite:////data/queue_board.db
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_PROVIDER: minio
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: gitwalk-objects
      OBJECT_STORE_ACCESS_KEY: gitwalk
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_REQUIRED: "true"
    ports: ["8000:8000"]
    volumes: ["api_data:/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_data:
